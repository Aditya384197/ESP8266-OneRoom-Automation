name: Build ESP8266 Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pip install esptool

      # ---------------------------------------------------
      # Build firmware
      # ---------------------------------------------------

      - name: Build firmware
        run: |
          pio run -e nodemcuv2 -v

      # ---------------------------------------------------
      # Build LittleFS filesystem
      # ---------------------------------------------------

      - name: Build LittleFS
        run: |
          pio run -e nodemcuv2 -t buildfs -v

      # ---------------------------------------------------
      # Verify outputs
      # ---------------------------------------------------

      - name: Verify build outputs
        run: |
          echo "===== Firmware ====="
          ls -lh .pio/build/nodemcuv2/firmware.bin
          test -f .pio/build/nodemcuv2/firmware.bin

          echo "===== LittleFS ====="
          ls -lh .pio/build/nodemcuv2/littlefs.bin
          test -f .pio/build/nodemcuv2/littlefs.bin

      # ---------------------------------------------------
      # Merge firmware + LittleFS into ONE flash image
      # ---------------------------------------------------

      - name: Create merged firmware
        run: |
          esptool merge_bin \
            -o .pio/build/nodemcuv2/merged_firmware.bin \
            --flash_size 4MB \
            0x00000 .pio/build/nodemcuv2/firmware.bin \
            0x300000 .pio/build/nodemcuv2/littlefs.bin

      # ---------------------------------------------------
      # Rename merged image to firmware.bin
      # ---------------------------------------------------

      - name: Prepare final firmware
        run: |
          mkdir -p artifacts

          cp .pio/build/nodemcuv2/merged_firmware.bin \
             artifacts/firmware.bin

          echo "===== FINAL FIRMWARE ====="
          ls -lh artifacts/firmware.bin

      # ---------------------------------------------------
      # Upload ONLY one file
      # ---------------------------------------------------

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation-firmware
          path: artifacts/firmware.bin
          if-no-files-found: error
