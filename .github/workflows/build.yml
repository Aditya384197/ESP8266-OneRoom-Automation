name: Build ESP8266 Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # Checkout
      # ===================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ===================================================
      # Python
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ===================================================
      # Install PlatformIO
      # ===================================================

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio


      # ===================================================
      # Show repository structure
      # ===================================================

      - name: Inspect repository
        run: |
          echo "===== Repository root ====="
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "./.pio/*" \
            | sort


      # ===================================================
      # Clean previous build
      # ===================================================

      - name: Clean build
        run: |
          set -e
          pio run -e nodemcuv2 -t clean


      # ===================================================
      # Build firmware
      # ===================================================

      - name: Build firmware
        run: |
          set -e

          echo "===== Building firmware ====="

          pio run -e nodemcuv2


      # ===================================================
      # Build LittleFS
      # ===================================================

      - name: Build LittleFS
        run: |
          set -e

          echo "===== Building LittleFS ====="

          pio run -e nodemcuv2 -t buildfs


      # ===================================================
      # Verify output
      # ===================================================

      - name: Verify firmware and LittleFS
        run: |
          set -e

          echo ""
          echo "=================================================="
          echo " BUILD OUTPUT"
          echo "=================================================="

          ls -lah .pio/build/nodemcuv2/

          echo ""
          echo "Checking firmware.bin..."

          test -s .pio/build/nodemcuv2/firmware.bin

          echo "firmware.bin: OK"

          echo ""
          echo "Checking littlefs.bin..."

          test -s .pio/build/nodemcuv2/littlefs.bin

          echo "littlefs.bin: OK"


      # ===================================================
      # Verify LittleFS source
      # ===================================================

      - name: Verify filesystem source
        run: |
          set -e

          echo ""
          echo "=================================================="
          echo " ROOT WEB FILES"
          echo "=================================================="

          for file in \
            index.html \
            settings.html \
            app.js \
            style.css
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "=================================================="
          echo " LITTLEFS TEMPORARY DIRECTORY"
          echo "=================================================="

          if [ -d ".piofs" ]; then
            find .piofs -type f -printf "%p\n" | sort
          else
            echo "ERROR: .piofs directory does not exist"
            exit 1
          fi


      # ===================================================
      # Prepare artifacts
      # ===================================================

      - name: Prepare artifacts
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          cp .pio/build/nodemcuv2/firmware.bin \
             artifacts/firmware.bin

          cp .pio/build/nodemcuv2/littlefs.bin \
             artifacts/littlefs.bin

          echo ""
          echo "=================================================="
          echo " FINAL ARTIFACTS"
          echo "=================================================="

          ls -lh artifacts/


      # ===================================================
      # Upload artifacts
      # ===================================================

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
