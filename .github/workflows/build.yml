name: Build ESP8266 Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Show project structure
        run: |
          echo "===== Project ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -path "./.pio/*" \
            | sort

      - name: Build firmware
        run: |
          pio run -e nodemcuv2 -v

      - name: Build LittleFS
        run: |
          echo "===== Building LittleFS ====="

          if [ ! -d "data" ]; then
            echo "ERROR: data directory does not exist."
            exit 1
          fi

          echo "===== LittleFS source files ====="
          find data -type f -print | sort

          pio run -e nodemcuv2 -t buildfs -v

      - name: Verify build output
        run: |
          echo "===== Build directory ====="
          ls -lah .pio/build/nodemcuv2/

          echo "===== Firmware ====="
          test -s .pio/build/nodemcuv2/firmware.bin

          echo "===== LittleFS ====="
          test -s .pio/build/nodemcuv2/littlefs.bin

          echo "===== File sizes ====="
          ls -lh \
            .pio/build/nodemcuv2/firmware.bin \
            .pio/build/nodemcuv2/littlefs.bin

      - name: Prepare artifacts
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          cp .pio/build/nodemcuv2/firmware.bin \
             artifacts/firmware.bin

          cp .pio/build/nodemcuv2/littlefs.bin \
             artifacts/littlefs.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation
          path: artifacts/
          if-no-files-found: error
