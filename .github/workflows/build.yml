name: Build ESP8266 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e nodemcuv2

      - name: Build filesystem image
        run: pio run -e nodemcuv2 -t buildfs

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-one-room-automation
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/littlefs.bin
