name: ESP8266 Firmware and LittleFS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Show build configuration
        run: |
          pio --version
          echo "===== PlatformIO configuration ====="
          cat platformio.ini
          echo "===== Source files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' ! -path './.pio/*' | sort

      - name: Build ESP8266 firmware
        run: |
          set -euo pipefail
          pio run -e nodemcuv2
          test -s .pio/build/nodemcuv2/firmware.bin
          echo "Firmware image verified."

      - name: Verify prepared LittleFS source
        run: |
          set -euo pipefail
          for file in index.html settings.html app.js style.css; do
            test -s ".piofs/$file"
          done
          echo "===== LittleFS source files ====="
          find .piofs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Build LittleFS image
        run: |
          set -euo pipefail
          pio run -e nodemcuv2 -t buildfs
          test -s .pio/build/nodemcuv2/littlefs.bin
          echo "LittleFS image verified."

      - name: Prepare and checksum artifacts
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          cp .pio/build/nodemcuv2/firmware.bin artifacts/firmware.bin
          cp .pio/build/nodemcuv2/littlefs.bin artifacts/littlefs.bin
          {
            echo "Board: NodeMCU v2 (ESP8266)"
            echo "PlatformIO environment: nodemcuv2"
            echo "Firmware: firmware.bin"
            echo "Filesystem: littlefs.bin"
            echo "Flash layout: 4 MB flash / 1 MB LittleFS"
          } > artifacts/BUILD-INFO.txt
          (cd artifacts && sha256sum firmware.bin littlefs.bin > SHA256SUMS)
          zip -j artifacts/ESP8266-OneRoom-Automation-1.4.0.zip \
            artifacts/firmware.bin artifacts/littlefs.bin \
            artifacts/BUILD-INFO.txt artifacts/SHA256SUMS
          ls -lh artifacts/

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-firmware
          path: artifacts/firmware.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload LittleFS image
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-littlefs
          path: artifacts/littlefs.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation-1.4.0
          path: |
            artifacts/ESP8266-OneRoom-Automation-1.4.0.zip
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
