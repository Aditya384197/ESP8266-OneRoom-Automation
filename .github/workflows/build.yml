
name: ESP8266 Complete Firmware Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Complete Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: Verify Project Configuration
        run: |
          set -euo pipefail

          echo "===== PlatformIO ====="
          pio --version

          echo "===== Project Configuration ====="
          cat platformio.ini

          echo "===== Complete Source Files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.pio/*' | sort

      - name: Build Complete ESP8266 Firmware
        run: |
          set -euo pipefail

          pio run -e nodemcuv2

          FIRMWARE=".pio/build/nodemcuv2/firmware.bin"

          if [ ! -s "$FIRMWARE" ]; then
            echo "ERROR: Firmware build failed!"
            exit 1
          fi

          mkdir -p artifacts
          cp "$FIRMWARE" artifacts/firmware.bin

          echo "Firmware build successful:"
          ls -lh artifacts/firmware.bin

      - name: Verify LittleFS Source Files
        run: |
          set -euo pipefail

          for file in index.html settings.html app.js style.css; do
            if [ ! -s ".piofs/$file" ]; then
              echo "ERROR: Missing LittleFS file: $file"
              exit 1
            fi
          done

          echo "LittleFS source verification successful."

      - name: Build Complete LittleFS Filesystem
        run: |
          set -euo pipefail

          pio run -e nodemcuv2 -t buildfs

          LITTLEFS=".pio/build/nodemcuv2/littlefs.bin"

          if [ ! -s "$LITTLEFS" ]; then
            echo "ERROR: LittleFS build failed!"
            exit 1
          fi

          cp "$LITTLEFS" artifacts/littlefs.bin

          echo "LittleFS build successful:"
          ls -lh artifacts/littlefs.bin

      - name: Verify Firmware and Filesystem
        run: |
          set -euo pipefail

          test -s artifacts/firmware.bin
          test -s artifacts/littlefs.bin

          python -m esptool \
            --chip esp8266 image_info artifacts/firmware.bin

          echo "Both binary images verified."

      - name: Merge Firmware and LittleFS
        run: |
          set -euo pipefail

          python -m esptool \
            --chip esp8266 merge_bin \
            --output artifacts/merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x00000 artifacts/firmware.bin \
            0x300000 artifacts/littlefs.bin

          if [ ! -s artifacts/merged.bin ]; then
            echo "ERROR: Merged binary was not generated!"
            exit 1
          fi

          echo "===== FINAL MERGED FIRMWARE ====="
          ls -lh artifacts/merged.bin

      - name: Generate Build Information and Checksums
        run: |
          set -euo pipefail

          {
            echo "Firmware Version: 1.7.2"
            echo "Board: NodeMCU v2"
            echo "Chip: ESP8266"
            echo "Flash Size: 4MB"
            echo "Filesystem: LittleFS"
            echo "Firmware Offset: 0x00000"
            echo "LittleFS Offset: 0x300000"
            echo "Final Output: merged.bin"
          } > artifacts/BUILD-INFO.txt

          cd artifacts

          sha256sum firmware.bin littlefs.bin merged.bin > SHA256SUMS

          zip ESP8266-OneRoom-Automation-1.7.2.zip \
            firmware.bin \
            littlefs.bin \
            merged.bin \
            BUILD-INFO.txt \
            SHA256SUMS

          echo "===== FINAL BUILD FILES ====="
          ls -lh

      - name: Upload Complete Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation-v1.7.2
          path: |
            artifacts/merged.bin
            artifacts/firmware.bin
            artifacts/littlefs.bin
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS
            artifacts/ESP8266-OneRoom-Automation-1.7.2.zip
          if-no-files-found: error
          retention-days: 30
