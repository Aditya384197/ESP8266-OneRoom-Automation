name: Build ESP8266 Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install PlatformIO
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Build ESP8266 firmware
      - name: Build firmware
        run: |
          pio run -e nodemcuv2 -v

      # Verify firmware
      - name: Verify firmware
        run: |
          echo "===== Build directory ====="
          ls -lah .pio/build/nodemcuv2/

          echo "===== Firmware ====="
          test -f .pio/build/nodemcuv2/firmware.bin

          echo "Firmware successfully generated:"
          ls -lh .pio/build/nodemcuv2/firmware.bin

      # Prepare firmware artifact
      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp .pio/build/nodemcuv2/firmware.bin artifacts/firmware.bin

      # Upload firmware
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation-firmware
          path: artifacts/firmware.bin
          if-no-files-found: error
