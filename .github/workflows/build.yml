name: ESP8266 Firmware and LittleFS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Show build configuration
        run: |
          set -euo pipefail
          pio --version
          echo "===== PlatformIO configuration ====="
          cat platformio.ini
          echo "===== Repository source files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' ! -path './.pio/*' | sort

      # Build and copy the firmware immediately. The later buildfs target can
      # regenerate PlatformIO's build directory, so do not depend on the
      # firmware.bin still being present after buildfs has run.
      - name: Build and stage ESP8266 firmware
        run: |
          set -euo pipefail
          pio run -e nodemcuv2

          FIRMWARE_PATH=".pio/build/nodemcuv2/firmware.bin"
          if [ ! -s "$FIRMWARE_PATH" ]; then
            echo "ERROR: Firmware output was not generated: $FIRMWARE_PATH"
            echo "===== PlatformIO build directory ====="
            find .pio/build -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
            exit 1
          fi

          mkdir -p artifacts
          cp "$FIRMWARE_PATH" artifacts/firmware.bin
          test -s artifacts/firmware.bin
          echo "Firmware staged before LittleFS build:"
          ls -lh artifacts/firmware.bin

      - name: Verify prepared LittleFS source
        run: |
          set -euo pipefail
          for file in index.html settings.html app.js style.css; do
            if [ ! -s ".piofs/$file" ]; then
              echo "ERROR: Missing or empty LittleFS source: .piofs/$file"
              exit 1
            fi
          done
          echo "===== LittleFS source files ====="
          find .piofs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Build and stage LittleFS image
        run: |
          set -euo pipefail
          pio run -e nodemcuv2 -t buildfs

          LITTLEFS_PATH=".pio/build/nodemcuv2/littlefs.bin"
          if [ ! -s "$LITTLEFS_PATH" ]; then
            echo "ERROR: LittleFS output was not generated: $LITTLEFS_PATH"
            echo "===== PlatformIO build directory ====="
            find .pio/build -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
            exit 1
          fi

          cp "$LITTLEFS_PATH" artifacts/littlefs.bin
          test -s artifacts/littlefs.bin
          echo "LittleFS image staged:"
          ls -lh artifacts/littlefs.bin

      - name: Prepare and checksum release artifacts
        run: |
          set -euo pipefail
          test -s artifacts/firmware.bin
          test -s artifacts/littlefs.bin

          {
            echo "Firmware version: 1.7.0"
            echo "Board: NodeMCU v2 (ESP8266)"
            echo "PlatformIO environment: nodemcuv2"
            echo "Firmware: firmware.bin"
            echo "Filesystem: littlefs.bin"
            echo "Flash layout: 4 MB flash / 1 MB LittleFS"
          } > artifacts/BUILD-INFO.txt

          (cd artifacts && sha256sum firmware.bin littlefs.bin > SHA256SUMS)

          zip -j artifacts/ESP8266-OneRoom-Automation-1.7.0.zip \
            artifacts/firmware.bin \
            artifacts/littlefs.bin \
            artifacts/BUILD-INFO.txt \
            artifacts/SHA256SUMS

          echo "===== Final artifacts ====="
          ls -lh artifacts/
          unzip -l artifacts/ESP8266-OneRoom-Automation-1.7.0.zip

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-firmware
          path: artifacts/firmware.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload LittleFS image
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-littlefs
          path: artifacts/littlefs.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-OneRoom-Automation-1.7.0
          path: |
            artifacts/ESP8266-OneRoom-Automation-1.7.0.zip
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
