<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1422">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Local four-channel room automation">
  <title>Room Automation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard-page">
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div class="logo-stage">
        <div class="logo-card" aria-label="Device logo"><span id="logoText">Room Automation</span></div>
      </div>
      <div class="header-actions">
        <div id="connection" class="connection offline" role="status" aria-live="polite"><i></i><span>Offline</span></div>
        <a class="settings-button" href="/settings.html" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 13.4 1.1.9-1.1 1.9-1.4-.5a7.8 7.8 0 0 1-1.4.8l-.2 1.5h-2.2l-.4-1.4a7.8 7.8 0 0 1-1.6 0l-.8 1.2-2-.9.3-1.5a7.7 7.7 0 0 1-1.1-1.2l-1.5.2-.7-2.1 1.2-.8a7.6 7.6 0 0 1-.1-1.6l-1.3-.7.8-2.1 1.5.2a7.7 7.7 0 0 1 1.2-1.1l-.2-1.5 2.1-.7.8 1.2a7.6 7.6 0 0 1 1.6-.1l.7-1.3 2.1.8-.2 1.5a7.7 7.7 0 0 1 1.1 1.2l1.5-.2.7 2.1-1.2.8a7.6 7.6 0 0 1 .1 1.6l1.3.7-.8 2.1-1.5-.2Z"/></svg>
        </a>
      </div>
    </header>

    <section id="relayGrid" class="relay-grid" aria-label="Relay controls">
      <button class="relay-card" type="button" data-index="0" aria-pressed="false">
        <span class="relay-top"><span class="relay-index">01</span><span class="relay-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v8m-5.7-5.7a8 8 0 1 0 11.4 0"/></svg></span></span>
        <span class="relay-name" data-relay-name="0">Ceiling Fan</span>
        <span class="relay-bottom"><span class="relay-caption">RELAY 1</span><span class="relay-state">OFF</span></span>
      </button>
      <button class="relay-card" type="button" data-index="1" aria-pressed="false">
        <span class="relay-top"><span class="relay-index">02</span><span class="relay-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3v6m8-6v6M6 9h12v3a6 6 0 0 1-12 0V9Zm6 9v3"/></svg></span></span>
        <span class="relay-name" data-relay-name="1">Charging Socket</span>
        <span class="relay-bottom"><span class="relay-caption">RELAY 2</span><span class="relay-state">OFF</span></span>
      </button>
      <button class="relay-card" type="button" data-index="2" aria-pressed="false">
        <span class="relay-top"><span class="relay-index">03</span><span class="relay-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.7c.6.4 1 1 1 1.8h6c0-.8.4-1.4 1-1.8A7 7 0 0 0 12 2Z"/></svg></span></span>
        <span class="relay-name" data-relay-name="2">LED 1</span>
        <span class="relay-bottom"><span class="relay-caption">RELAY 3</span><span class="relay-state">OFF</span></span>
      </button>
      <button class="relay-card" type="button" data-index="3" aria-pressed="false">
        <span class="relay-top"><span class="relay-index">04</span><span class="relay-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.7c.6.4 1 1 1 1.8h6c0-.8.4-1.4 1-1.8A7 7 0 0 0 12 2Z"/></svg></span></span>
        <span class="relay-name" data-relay-name="3">LED 2</span>
        <span class="relay-bottom"><span class="relay-caption">RELAY 4</span><span class="relay-state">OFF</span></span>
      </button>
    </section>
    <p id="dashboardMessage" class="dashboard-message" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
