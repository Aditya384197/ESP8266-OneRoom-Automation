[platformio]
default_envs = nodemcuv2
src_dir = .
data_dir = .piofs

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; Compile only the root-level firmware sources. Web assets are placed in
; .piofs by prepare_fs.py and are consumed separately by the buildfs target.
build_src_filter =
    +<*.cpp>
    -<.pio/>
    -<.piofs/>
    -<.github/>

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
extra_scripts = pre:prepare_fs.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
